name: Build Hominhtuan95 8 Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone GUI EXE
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m py_compile Hominhtuan95.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Hominhtuan95 Hominhtuan95.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hominhtuan95_8CuaSo_EXE
          path: dist/Hominhtuan95.exe
